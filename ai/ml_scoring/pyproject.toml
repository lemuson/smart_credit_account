[project]
name = "ml-scoring"
version = "1.0.0"
requires-python = ">=3.11,<3.14"
dependencies = ["pyyaml>=6,<7", "joblib>=1.4,<2", "numpy>=2.2,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2", "pydantic>=2.12,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_scoring"]
