[project]
name = "alfa-smart-credit-ai-service"
version = "0.1.0"
description = "Local-first AI service for the Smart Entrepreneur Credit Cabinet MVP"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary hackathon prototype" }
dependencies = [
  "chromadb==1.5.9",
  "fastapi==0.150.0",
  "faststream[rabbit]==0.7.7",
  "httpx>=0.28.1,<0.29",
  "ollama==0.6.3",
  "pydantic>=2.12.0,<3",
  "pydantic-settings>=2.11.0,<3",
  "pypdf>=6.1.0,<7",
  "python-json-logger>=4.0.0,<5",
  "uvicorn[standard]>=0.38.0,<0.39",
]

[dependency-groups]
dev = [
  "pytest>=8.4.2,<9",
  "pytest-asyncio>=1.2.0,<2",
  "pytest-cov>=7.0.0,<8",
  "respx>=0.22.0,<0.23",
  "ruff>=0.14.0,<0.15",
]
ml = [
  "catboost>=1.2.8,<2",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.6,<2",
]

[project.scripts]
ai-ingest = "scripts.ingest:main"
ai-smoke-test = "scripts.smoke_test:main"
ai-evaluate-rag-demo = "scripts.evaluate_rag_demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mock_backend", "scripts"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
  "integration: requires one or more external services",
  "ollama: requires a local Ollama instance and configured models",
  "rabbitmq: requires RabbitMQ",
]
testpaths = ["tests", "ml_scoring/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008", "RUF001"]
