[project]
name = "smart-credit-backend"
version = "0.1.0"
description = "Backend кредитного кабинета предпринимателя"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "ml-scoring",
  "aio-pika>=9.5,<10",
  "fastapi>=0.121,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "email-validator>=2.2,<3",
  "reportlab>=4.4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "pypdf>=6,<7",
    "jsonschema>=4,<5",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
markers = ["rabbitmq: requires an isolated RabbitMQ via TEST_RABBITMQ_URL",
           "scoring_e2e: requires approved model artifacts via SCORING_E2E_MODELS_DIR"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
ml-scoring = { path = "../ai/ml_scoring" }
