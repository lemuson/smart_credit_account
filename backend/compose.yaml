name: smart-credit

x-backend: &backend
  build:
    context: .
    additional_contexts:
      ml_scoring: ../ai/ml_scoring
    target: production
  image: smart-credit-backend:local
  environment: &backend-environment
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-credit}
    POSTGRES_USER: ${POSTGRES_USER:-credit}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
    SCORING_MODELS_DIR: /models
    TOKEN_MINUTES: ${TOKEN_MINUTES:-60}
    MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-10485760}

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credit}
      POSTGRES_USER: ${POSTGRES_USER:-credit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed-data:
    <<: *backend
    command: ["python", "-m", "app.cli", "seed-data"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *backend
    volumes:
      - type: bind
        source: ${SCORING_MODELS_DIR:-../ai/ml_scoring/models}
        target: /models
        read_only: true
        bind:
          create_host_path: true
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed-data:
        condition: service_completed_successfully
    restart: unless-stopped

  tests:
    build:
      context: .
      additional_contexts:
        ml_scoring: ../ai/ml_scoring
      target: test
    profiles: ["test"]
    environment:
      <<: *backend-environment
      TEST_POSTGRES: "1"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
