openapi: 3.1.0
info:
  title: Smart Credit Cabinet Scoring Contract
  version: 1.0.0-draft
  description: >-
    Draft contract for a demonstration synthetic-data score. It is not a bank
    approval decision. This file does not expose a running service.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/scoring/assessments:
    post:
      operationId: createScoringAssessment
      summary: Create an immutable assessment for an owned application version
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentCreate'
      responses:
        '201':
          description: Assessment created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResponse'
        '200':
          description: Idempotent replay of an existing assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/scoring/assessments/{assessment_id}:
    get:
      operationId: getScoringAssessment
      summary: Read a saved assessment without rerunning inference
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
        - $ref: '#/components/parameters/WhatIfIdQuery'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Owned assessment, optionally with one selected What-if
          headers:
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/scoring/assessments/{assessment_id}/what-if:
    post:
      operationId: createScoringWhatIf
      summary: Re-score a copied snapshot with explicit changed fields
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatIfCreate'
      responses:
        '201':
          description: What-if simulation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatIfResponse'
        '200':
          description: Idempotent replay of an existing What-if
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatIfResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AssessmentId:
      name: assessment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WhatIfIdQuery:
      name: what_if_id
      in: query
      required: false
      description: Return this saved simulation in selected_what_if.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
  responses:
    AuthenticationError:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AuthorizationError:
      description: Authenticated identity lacks the required role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource is absent or hidden by tenant isolation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Application version, idempotency, or model-version conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Formal validation or unsupported scoring range; no score is returned
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Local scoring runtime is not ready
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AssessmentCreate:
      type: object
      additionalProperties: false
      required:
        - application_id
      properties:
        application_id:
          type: string
          format: uuid
        expected_application_version:
          type:
            - integer
            - 'null'
          minimum: 1
    WhatIfCreate:
      type: object
      additionalProperties: false
      required:
        - changes
      properties:
        changes:
          $ref: '#/components/schemas/WhatIfChanges'
    WhatIfChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        annual_revenue:
          type: number
          exclusiveMinimum: 0
        credit_history:
          type: string
          enum: [good, average, bad, none]
        business_age_months:
          type: integer
          minimum: 0
        loan_amount:
          type: number
          exclusiveMinimum: 0
        has_collateral:
          type: boolean
        loan_term_months:
          type: integer
          enum: [6, 12, 18, 24, 36, 48, 60]
    AssessmentResponse:
      type: object
      additionalProperties: false
      required:
        - assessment_id
        - application_id
        - application_version
        - schema_version
        - status
        - model
        - demonstration_only
        - score
        - explanation
        - limitations_warning
        - calculated_at
        - selected_what_if
      properties:
        assessment_id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
        application_version:
          type: integer
          minimum: 1
        schema_version:
          type: string
          const: '1.0'
        status:
          type: string
          const: completed
        model:
          $ref: '#/components/schemas/ModelDescriptor'
        demonstration_only:
          type: boolean
          const: true
        score:
          $ref: '#/components/schemas/Score'
        explanation:
          $ref: '#/components/schemas/Explanation'
        limitations_warning:
          type: string
          minLength: 1
        calculated_at:
          type: string
          format: date-time
        selected_what_if:
          oneOf:
            - $ref: '#/components/schemas/WhatIfResponse'
            - type: 'null'
    ModelDescriptor:
      type: object
      additionalProperties: false
      required: [model_id, model_version, family, bundle_sha256]
      properties:
        model_id:
          type: string
          minLength: 1
        model_version:
          type: string
          minLength: 1
        family:
          type: string
          const: logistic_regression
        bundle_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    Score:
      type: object
      additionalProperties: false
      required: [name, value, display_percent]
      properties:
        name:
          type: string
          const: synthetic_model_score
        value:
          type: number
          minimum: 0
          maximum: 1
        display_percent:
          type: number
          minimum: 0
          maximum: 100
    Explanation:
      type: object
      additionalProperties: false
      required: [baseline, factors, consistency]
      properties:
        baseline:
          $ref: '#/components/schemas/ExplanationBaseline'
        factors:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: '#/components/schemas/Factor'
        consistency:
          $ref: '#/components/schemas/ExplanationConsistency'
    ExplanationBaseline:
      type: object
      additionalProperties: false
      required: [method, logit, reference_version, reference_sha256]
      properties:
        method:
          type: string
          const: mean_in_transformed_train_space
        logit:
          type: number
        reference_version:
          type: string
        reference_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    Factor:
      type: object
      additionalProperties: false
      required:
        - feature
        - display_name
        - input_value
        - baseline_value
        - logit_contribution
        - direction
        - rank
      properties:
        feature:
          type: string
          enum:
            - annual_revenue
            - credit_history
            - business_age_months
            - loan_amount
            - has_collateral
            - loan_term_months
        display_name:
          type: string
          minLength: 1
        input_value: {}
        baseline_value: {}
        logit_contribution:
          type: number
        direction:
          type: string
          enum: [positive, negative, neutral]
        rank:
          type: integer
          minimum: 1
          maximum: 6
    ExplanationConsistency:
      type: object
      additionalProperties: false
      required:
        - model_logit
        - contribution_sum
        - reconstructed_logit
        - reconstruction_error
      properties:
        model_logit:
          type: number
        contribution_sum:
          type: number
        reconstructed_logit:
          type: number
        reconstruction_error:
          type: number
          minimum: 0
    WhatIfResponse:
      type: object
      additionalProperties: false
      required:
        - what_if_id
        - assessment_id
        - schema_version
        - simulation_only
        - changed_fields
        - original
        - alternative
        - delta_percentage_points
        - limitations_warning
        - calculated_at
      properties:
        what_if_id:
          type: string
          format: uuid
        assessment_id:
          type: string
          format: uuid
        schema_version:
          type: string
          const: '1.0'
        simulation_only:
          type: boolean
          const: true
        changed_fields:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - annual_revenue
              - credit_history
              - business_age_months
              - loan_amount
              - has_collateral
              - loan_term_months
        original:
          $ref: '#/components/schemas/ScoringSnapshot'
        alternative:
          $ref: '#/components/schemas/ScoringSnapshot'
        delta_percentage_points:
          type: number
        limitations_warning:
          type: string
          minLength: 1
        calculated_at:
          type: string
          format: date-time
    ScoringSnapshot:
      type: object
      additionalProperties: false
      required: [score, factors]
      properties:
        score:
          $ref: '#/components/schemas/Score'
        factors:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: '#/components/schemas/Factor'
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, detail, instance, request_id, errors]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: '^[A-Z0-9_]+$'
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
